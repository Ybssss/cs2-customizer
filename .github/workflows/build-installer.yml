# 打包链路的门禁。**它自己不发布 Release。**
#
# 发版走 .github/workflows/release.yml：那条流水线先跑 ci.yml 求全绿，再 `uses:` 调用本
# 流水线打包，拿这里的 artifact 去建 Release。职责分开是因为写权限（contents: write）
# 不该和"要跑 PyInstaller / Inno / choco install 的构建"共用一张令牌。
# 手工推 v* tag 触发本流水线时，产物仍然只留 90 天 artifact，不建 Release。
#
# 面向终端用户的闭源商业版安装包走官网（需注册；地址见 README 顶部）。
# Release 里的 exe 就是本仓库这份 GPL-3.0 源码的构建产物。
#
# 那为什么还留这条流水线？因为**打包链路自己就是一类缺陷的产地**，而 ci.yml 不碰它：
#   - PyInstaller 的 onedir / onefile 两条分支行为不对称（历史上 onedir 会炸而
#     onefile 静默产出空包）；
#   - 发布包曾经把打包机的活 config.json 带进产物，导致每台新机器首启都继承
#     打包机的 CS2 路径（QA-001）；
#   - Inno 脚本的 AppId / 目录名 / InstallDelete 三处任一写错，都是"装完才发现"。
# 这些只有真的走一遍构建 + 编译安装包才会暴露。产物作为 artifact 留 90 天供排查，
# **不进 Release、不构成分发**。
#
# ⚠️ 产物没有代码签名，Windows SmartScreen 会对下载的 exe 报"未知发布者"。
#    这是没有代码签名证书的必然结果，不是构建问题。
name: build-installer

on:
  # 被 release.yml 调用来产出发版附件。走这条入口时 github.ref 仍然是 tag,
  # 所以下面那道 "tag 与 config.py 的 VERSION 必须一致" 的校验照样生效。
  workflow_call:
  push:
    tags:
      - "v*"
  # 平时想验一次打包链路就手工触发
  workflow_dispatch:

# 只读就够——本流水线不写回任何仓库状态（不建 Release、不推 tag）。
# artifact 上传不需要 contents:write。
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # 第三方 action 一律按 commit SHA 固定，理由见 ci.yml。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements_qt.txt
            requirements-build.txt

      - name: 校验 tag 与 config.py 的 VERSION 一致
        # 不一致就早停。否则会产出一个"tag 说 v2.2.3、exe 属性写 2.2.2"的包，
        # 那种包发出去之后排障时会把所有人绕进去。
        # 仓库里已有 tests/test_version_consistency.py 守着四处同源，
        # 这里补的是"tag 也算第五处"。
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          ver=$(python -c "import re,io;print(re.search(r'^VERSION\s*=\s*\"([^\"]+)\"',io.open('config.py',encoding='utf-8').read(),re.M).group(1))")
          echo "tag=$tag  config.VERSION=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag 与 config.py 的 VERSION=$ver 不一致"
            exit 1
          fi

      - name: 安装依赖
        # ⚠⚠ 装的是**运行时**依赖,不只是 Qt 那一半。
        # requirements_qt.txt 只有 Qt 专用包(它自己写着"核心运行依赖在 requirements.txt 里"),
        # 以前这条流水线只装 requirements_qt.txt + requirements-build.txt,于是冻进 exe 的
        # 缺 flask —— 而 gsi_server.py:7 是顶层 `from flask import ...`,主窗口启动 GSI
        # 接收端就会用到它。后果已经发出去了:2026-09-28 第一个成功发布的 v2.3.1,
        # 双击即 `No module named 'flask'`(那个 Release 要不要撤回见 PROGRESS.md section 4)。
        # 同一次装依赖还漏过 pytest:build_release.py:951 默认把 tests/test_no_bundled_assets.py
        # 当作**打包前的门禁**跑,只有 --skip-tests 才跳过。
        run: pip install -r requirements_qt.txt -r requirements.txt -r requirements-build.txt pytest

      - name: 构建 onedir 产物
        # --without-bundled-assets 是开源版构建的必需开关：构建链路默认断言
        # 产物里带着素材（那是闭源版的前提），不加这个开关校验会直接拦下来。
        run: python build_tools/build_release.py --mode onedir --no-obfuscate --without-bundled-assets

      - name: 核对产物里真的冻进了启动必需的模块
        # ⚠ 事故 v2.3.1:依赖表对、CI 绿、构建也绿,唯独产物里没有 flask,用户双击即
        # "No module named 'flask'"。前面所有判据量的是**声明**,这一条量的是**产物**——
        # 只查一头,另一头照样能漏。放在 Inno 之前,坏产物在这里就停,不必编完安装包。
        run: python build_tools/check_frozen_bundle.py

      - name: 安装 Inno Setup
        # 用 choco（windows runner 自带）而不是第三方 action：少一个供应链面。
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        # 用项目自己那条路径,别在 shell 里手搓 iscc 调用。
        # 手搓那版在 runner 上死于 ISCC 的 "You may not specify more than one script filename"
        # (实测 release run 36406788535,作业 build 第 8 步):`shell: bash` 是 git-bash,
        # `$(python -c ...)` 的输出带着 Windows 的 \r,而 `/DAppVersion=<值>` 这种以斜杠
        # 开头的参数还会被 MSYS 的参数转换搅一遍 —— 两者叠加,ISCC 把第二个参数当成了
        # 第二个脚本名。**报错信息完全指不到真正的原因**,因为错的是两层的转义。
        # `build_release.py --installer-only` 那条路把三件事都做对了:版本号从
        # config.VERSION 直读经 /DAppVersion 传入(iss 里漏传会 #error 当场中止)、
        # find_tool("iscc") 负责定位编译器并给出"找过哪些路径"的报错、
        # subprocess 用**列表**传参,完全不经过任何 shell 的引号与参数改写。
        # ⚠ --installer-only 必须配 --mode onedir:安装包的 [Files] 段只吃 onedir 形态。
        run: python build_tools/build_release.py --mode onedir --installer-only

      - name: 算 SHA256
        shell: bash
        run: |
          cd release/installer
          for f in *.exe; do
            sha256sum "$f" | tee "$f.sha256"
          done

      - name: 上传构建产物（无论是否建 Release 都留一份）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer
          path: |
            release/installer/*.exe
            release/installer/*.sha256
          if-no-files-found: error
